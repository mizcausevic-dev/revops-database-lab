name: CI

on:
  push:
    branches: ["main", "project/**", "codex/**"]
  pull_request:

jobs:
  postgres-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: revops_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d revops_lab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d revops_lab -f sql/schema.sql

      - name: Seed data
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d revops_lab -f sql/seed.sql

      - name: Run analytics queries
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d revops_lab -f sql/queries.sql

